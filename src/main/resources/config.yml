# ========================================
#    ClanSystem Configuration
#    Author: animesao
# ========================================

# Настройки клана
clan:
  # Длина названия клана
  min-name-length: 3
  max-name-length: 16

  # Длина тега клана
  min-tag-length: 2
  max-tag-length: 5

  # Базовый лимит участников (на 1 уровне)
  base-member-limit: 10

  # Сколько участников добавляется за каждый уровень
  members-per-level: 2

  # Время жизни приглашения (в секундах)
  invite-expire-time: 300

  # Кулдаун телепортации на базу (в секундах)
  home-cooldown: 30

  # Стоимость создания клана (требуется Vault)
  creation-cost: 10000.0

  # Требуется ли оплата для создания клана
  creation-cost-enabled: true

# Настройки казны
bank:
  # Включить казну клана (требуется Vault)
  enabled: true

  # Налог на снятие из казны (в процентах, 0 = без налога)
  withdraw-tax: 0

  # Минимальная сумма для внесения
  min-deposit: 10

  # Минимальная сумма для снятия
  min-withdraw: 10

# ========================================
#    Настройки хранилища клана
# ========================================
storage:
  # Настройка вместимости (прокачка внутри страницы)
  # Уровень хранилища повышается в меню настроек клана.
  upgrades:
    # Максимальный уровень, до которого можно прокачать вместимость
    max-level: 5
    
    # Сколько новых слотов открывается за каждый уровень прокачки хранилища.
    # В одной странице всего 27 слотов (3 ряда по 9).
    # Пример при 9:
    #   Ур. 1 -> 9 слотов (1 ряд)
    #   Ур. 2 -> 18 слотов (2 ряда)
    #   Ур. 3 -> 27 слотов (вся страница открыта)
    #   Ур. 4+ -> Будут открыты все слоты на новых страницах
    slots-per-level: 9

  # Настройка страниц (количество вкладок)
  # Количество страниц зависит ТОЛЬКО от уровня самого клана (%clan_level%).
  # Вы можете добавлять свои уровни и менять количество страниц.
  # Формат: 'УровеньКлана: КоличествоСтраниц'
  page-limits:
    # Лимит для уровней, которые не указаны ниже
    default: 1
    # Примеры настройки:
    # На 1 уровне - 1 страница
    1: 1
    # На 5 уровне - 2 страницы
    5: 2
    # На 10 уровне - 3 страницы
    10: 3
    # На 15 уровне - 4 страницы
    15: 4
    # На 20 уровне - 5 страниц
    20: 5

  # Текстовые уведомления
  messages:
    # Когда игрок пытается нажать "Вперед", но лимит страниц достигнут
    limit-reached: "&c&lОшибка! &7Ваш клан достиг лимита страниц (&f%limit%&7) для &e%level% &7уровня."
    # Когда игрок кликает на барьер (заблокированный слот внутри страницы)
    slot-locked: "&c&lСлот заблокирован! &7Улучшите уровень хранилища в настройках клана."

# Ограничения по мирам
world-restrictions:
  enabled: false
  allowed-worlds:
    - world
    - world_nether
    - world_the_end

# Настройки сообщений
messages:
  prefix: "&8[&#FF6B6BК&#FF8E53л&#FFB347а&#E2C044н&#C4D93Fы&8] &7"